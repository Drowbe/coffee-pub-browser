<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>Coffee Pub Browser - Control Panel</title>
  <link rel="stylesheet" href="control.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">&#9749;</span>
      <div>
        <h1>Coffee Pub Browser</h1>
        <p class="subtitle">Two fixed-size Chromium windows for OBS. Add each one in OBS as a <strong>Window Capture</strong> source.</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="open-all" class="btn btn-primary" type="button">Open All</button>
      <button id="close-all" class="btn" type="button">Close All</button>
    </div>
  </header>

  <main>
    <section id="views" class="views"></section>

    <section class="card global">
      <h2>Layout &amp; Startup</h2>
      <div class="row">
        <label class="field field-inline">
          <span>Display</span>
          <select id="arrange-display"></select>
        </label>
        <button id="arrange" class="btn" type="button" title="Game at top-left, Stream to its right (or below if they do not fit)">Auto-arrange on display</button>
      </div>
      <div class="row">
        <label class="check">
          <input id="open-on-launch" type="checkbox">
          <span>Open both windows when the app launches</span>
        </label>
      </div>
      <div class="row">
        <label class="check">
          <input id="show-grips" type="checkbox">
          <span>Show grip bars above the windows (Cmd+G). Drag a grip to move its window; arrow keys nudge it. Grips are never captured by OBS.</span>
        </label>
      </div>
      <p class="hint" id="retina-hint"></p>
    </section>

    <section class="card">
      <h2>Session</h2>
      <p class="hint">Both windows share one login. Log into Foundry in the Game window and the Stream window uses the same session.</p>
      <div class="row">
        <button id="clear-session" class="btn btn-danger" type="button">Sign out (clear cookies)</button>
        <button id="reveal-config" class="btn" type="button">Show config file</button>
        <button id="reset-config" class="btn" type="button">Reset to defaults</button>
      </div>
    </section>
  </main>

  <footer class="statusbar">
    <span id="save-state">All changes saved</span>
    <span id="app-info"></span>
  </footer>

  <template id="view-template">
    <article class="card view">
      <header class="view-head">
        <h2 class="view-title"></h2>
        <span class="badge badge-closed" data-role="badge">Closed</span>
      </header>

      <div class="grid">
        <label class="field span-2">
          <span>URL</span>
          <input data-field="url" type="url" placeholder="https://game.coffeepub.live/game" spellcheck="false">
        </label>
        <label class="field">
          <span>Label</span>
          <input data-field="label" type="text" maxlength="40">
        </label>
        <label class="field">
          <span>Width (px)</span>
          <input data-field="width" type="number" min="100" max="7680" step="1">
        </label>
        <label class="field">
          <span>Height (px)</span>
          <input data-field="height" type="number" min="100" max="7680" step="1">
        </label>
        <label class="field">
          <span>Zoom</span>
          <input data-field="zoom" type="number" min="0.25" max="5" step="0.05">
        </label>
        <label class="field">
          <span>X</span>
          <input data-field="x" type="number" step="1" placeholder="auto">
        </label>
        <label class="field">
          <span>Y</span>
          <input data-field="y" type="number" step="1" placeholder="auto">
        </label>
        <div class="field checks span-2">
          <label class="check"><input data-field="enabled" type="checkbox"><span>Open on launch</span></label>
          <label class="check"><input data-field="muted" type="checkbox"><span>Mute audio</span></label>
        </div>
      </div>

      <div class="view-actions">
        <button class="btn btn-primary" data-action="open" type="button">Open</button>
        <button class="btn" data-action="focus" type="button">Bring to front</button>
        <button class="btn" data-action="reload" type="button">Reload</button>
        <button class="btn" data-action="center" type="button">Center on display</button>
        <button class="btn" data-action="devtools" type="button">DevTools</button>
        <button class="btn btn-danger" data-action="close" type="button">Close</button>
      </div>

      <dl class="status">
        <div><dt>OBS window name</dt><dd data-status="title">-</dd></div>
        <div><dt>Window size</dt><dd data-status="size">-</dd></div>
        <div><dt>Captured pixels</dt><dd data-status="capture">-</dd></div>
        <div><dt>Position</dt><dd data-status="position">-</dd></div>
        <div><dt>Current URL</dt><dd data-status="url">-</dd></div>
      </dl>
    </article>
  </template>

  <script src="control.js"></script>
</body>
</html>
