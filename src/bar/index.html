<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>Coffee Pub Browser</title>
  <link rel="stylesheet" href="bar.css">
</head>
<body>
  <div class="bar" id="bar" tabindex="0">
    <span class="dots" aria-hidden="true"></span>
    <span class="label" id="label">Window</span>
    <span class="hint">drag to move · arrow keys resize (shift = 10px)</span>
    <!-- Per-window controls go here. Give each one class="control" so it is clickable. -->
    <span class="controls" id="controls"></span>
    <span class="readout" id="readout"></span>
  </div>
  <script src="bar.js"></script>
</body>
</html>
